<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --bg-primary: #030305;
      --bg-glass: rgba(15, 15, 20, 0.4);
      --bg-secondary: rgba(15, 15, 20, 0.4);
      --bg-tertiary: rgba(30, 30, 40, 0.3);
      --bg-hover: rgba(255, 255, 255, 0.05);
      --accent: #22d3ee;
      --accent-dim: rgba(34, 211, 238, 0.1);
      --accent-glow: 0 0 15px rgba(34, 211, 238, 0.25);
      --text-primary: #f2f2f5;
      --text-secondary: #94a3b8;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
      --radius: 8px;
      --border: rgba(255,255,255,0.08);
      --border-bright: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      background: var(--bg-primary);
      background-image: radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.08) 0%, transparent 40%);
    }

    /* ── Header ──────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .header img { width: 26px; height: 26px; border-radius: 6px; }
    .header h2 {
      font-size: 15px;
      font-weight: 700;
      flex: 1;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .header .version {
      font-size: 9px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      opacity: 0.6;
    }

    /* ── Status bar ──────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #6b7280;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .status-dot.online { background: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
    .status-dot.degraded { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.3); }
    .status-text { flex: 1; color: var(--text-muted); transition: color 0.3s; }
    .status-text.online { color: #10b981; }
    .status-text.degraded { color: #fbbf24; }
    .status-text.offline { color: #f87171; }

    .services-row {
      display: flex;
      gap: 4px;
      padding: 6px 16px 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .svc-pill {
      font-size: 9px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.03);
      color: #475569;
      border: 1px solid transparent;
    }
    .svc-pill.up { color: #10b981; border-color: rgba(16, 185, 129, 0.2); }
    .svc-pill.down { color: #64748b; border-color: rgba(100, 116, 139, 0.15); }

    /* ── Section ─────────────────────────────────────── */
    .btn-section { padding: 10px 12px 6px; }
    .btn-section-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      padding: 0 4px 8px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-grid.single { grid-template-columns: 1fr; }

    .eco-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      transition: all 0.15s ease;
    }
    .eco-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-1px);
    }
    .eco-btn:active { transform: scale(0.97); }
    .eco-btn .icon { font-size: 16px; flex-shrink: 0; }
    .eco-btn .label { flex: 1; text-align: left; }
    .eco-btn .sub {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 400;
      display: block;
      margin-top: 1px;
    }

    .eco-btn.primary {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(34, 211, 238, 0.05));
      border-color: rgba(34, 211, 238, 0.3);
    }
    .eco-btn.primary:hover {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.25), rgba(34, 211, 238, 0.1));
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.15);
    }

    .eco-btn.accent {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(99, 102, 241, 0.05));
      border-color: rgba(99, 102, 241, 0.3);
    }
    .eco-btn.accent:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(99, 102, 241, 0.1));
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
    }

    .divider { height: 1px; background: var(--border); margin: 2px 0; }

    /* ── Feedback ─────────────────────────────────────── */
    .feedback {
      padding: 8px 16px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      display: none;
      border-top: 1px solid var(--border);
    }
    .feedback.show { display: block; }
    .feedback.success { color: #10b981; }
    .feedback.error { color: #f87171; }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      padding: 8px 16px 12px;
      text-align: center;
      font-size: 9px;
      color: #334155;
    }
    .footer a { color: #6366f1; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="../icons/icon48.png" alt="AitherConnect" />
    <h2>AitherConnect</h2>
    <span class="version">v2.0.0</span>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Checking...</span>
  </div>
  <div class="services-row" id="services-row"></div>

  <!-- Dashboard / Veil -->
  <div class="btn-section">
    <div class="btn-section-label">Dashboard</div>
    <div class="btn-grid">
      <button class="eco-btn primary" id="btn-veil-local">
        <span class="icon">🖥️</span>
        <span class="label">AitherVeil<span class="sub" id="veil-url-label">Dashboard</span></span>
      </button>
      <button class="eco-btn accent" id="btn-veil-cloud">
        <span class="icon">☁️</span>
        <span class="label">Cloud Demo<span class="sub">demo.aitherium.com</span></span>
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Ecosystem Apps -->
  <div class="btn-section">
    <div class="btn-section-label">Ecosystem</div>
    <div class="btn-grid">
      <button class="eco-btn" id="btn-desktop">
        <span class="icon">🪟</span>
        <span class="label">Desktop App<span class="sub">AitherDesktop</span></span>
      </button>
      <button class="eco-btn" id="btn-sidepanel">
        <span class="icon">📡</span>
        <span class="label">Side Panel<span class="sub">Chat · IRC · Search</span></span>
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Quick Actions -->
  <div class="btn-section">
    <div class="btn-section-label">Quick Actions</div>
    <div class="btn-grid">
      <button class="eco-btn" id="btn-harvest">
        <span class="icon">🧲</span>
        <span class="label">Harvest Page<span class="sub">Extract to knowledge base</span></span>
      </button>
      <button class="eco-btn" id="btn-settings">
        <span class="icon">⚙️</span>
        <span class="label">Settings<span class="sub">Connection config</span></span>
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Install / Get Started -->
  <div class="btn-section">
    <div class="btn-section-label">Get AitherOS</div>
    <div class="btn-grid">
      <button class="eco-btn" id="btn-get-aitheros">
        <span class="icon">🧠</span>
        <span class="label">AitherOS<span class="sub">Full AI platform</span></span>
      </button>
      <button class="eco-btn" id="btn-get-aithershell">
        <span class="icon">⚡</span>
        <span class="label">AitherShell<span class="sub">CLI engine (core)</span></span>
      </button>
      <button class="eco-btn" id="btn-get-aithernode">
        <span class="icon">🔌</span>
        <span class="label">AitherNode<span class="sub">MCP server / API</span></span>
      </button>
      <button class="eco-btn" id="btn-get-aitherdesktop">
        <span class="icon">🪟</span>
        <span class="label">AitherDesktop<span class="sub">Native app</span></span>
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Tunnel / Remote -->
  <div class="btn-section">
    <div class="btn-section-label">Connect</div>
    <div class="btn-grid">
      <button class="eco-btn" id="btn-tunnel">
        <span class="icon">🌐</span>
        <span class="label">Tunnel<span class="sub">tunnel.aitherium.com</span></span>
      </button>
      <button class="eco-btn" id="btn-irc">
        <span class="icon">📡</span>
        <span class="label">IRC Chat<span class="sub">irc.aitherium.com</span></span>
      </button>
    </div>
  </div>

  <!-- Feedback -->
  <div class="feedback" id="feedback"></div>

  <!-- Footer -->
  <div class="footer">
    AitherZero Protocol · <a href="https://aitherium.com" target="_blank">aitherium.com</a>
  </div>

  <script src="../shared/themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
